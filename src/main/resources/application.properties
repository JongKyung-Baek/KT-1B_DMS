# PostgreSQL connection. Production and shared environments must inject the
# password; credentials are never stored in the application artifact.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${KT1B_DB_URL:jdbc:postgresql://localhost:5432/kt1b}
spring.datasource.username=${KT1B_DB_USERNAME:myuser}
spring.datasource.password=${KT1B_DB_PASSWORD}

# External synchronization remains disabled until its signed interface phase.
update.distribution.scheduler.enabled=false
file.auto.insert.scheduler.enabled=false
send.mail.scheduler.enabled=false

# Signed TDMS -> external viewer document hand-off. The shared secret must only be
# supplied by the runtime environment; it is never stored in the database.
tdms.viewer.enabled=${TDMS_VIEWER_ENABLED:false}
tdms.viewer.base-url=${TDMS_VIEWER_BASE_URL:https://demo.esob.kr:7442}
tdms.viewer.client-id=${TDMS_VIEWER_CLIENT_ID:}
tdms.viewer.callback-client-id=${TDMS_VIEWER_CALLBACK_CLIENT_ID:}
tdms.viewer.shared-secret=${TDMS_VIEWER_SHARED_SECRET:}
tdms.viewer.work-dir=${TDMS_VIEWER_WORK_DIR:${java.io.tmpdir}/kt1b-viewer}
tdms.viewer.connect-timeout-ms=${TDMS_VIEWER_CONNECT_TIMEOUT_MS:5000}
tdms.viewer.read-timeout-ms=${TDMS_VIEWER_READ_TIMEOUT_MS:30000}
tdms.viewer.signature-clock-skew-seconds=${TDMS_VIEWER_SIGNATURE_CLOCK_SKEW_SECONDS:300}
tdms.viewer.state-retention-days=${TDMS_VIEWER_STATE_RETENTION_DAYS:30}

mybatis.mapper-locations=classpath:/sqlMaps/**/*.xml
mybatis.config-location=classpath:mybatis-config.xml

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
spring.mvc.static-path-pattern=/resources/**
spring.mvc.contentnegotiation.media-types.js=application/javascript
spring.web.resources.chain.strategy.content.enabled=true

# Preserve the legacy Ant-style controller mappings while running on Boot 2.7.
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

spring.freemarker.cache=false
spring.thymeleaf.cache=false

server.tomcat.max-http-form-post-size=800MB
server.tomcat.max-swallow-size=0
# Measured from the packaged WAR. JSTL, Spring MVC and Spring Security
# tag-library JARs are intentionally not skipped.
server.tomcat.additional-tld-skip-patterns=checker-qual-3.55.1.jar,commons-text-1.6.jar,ezmorph-1.0.6.jar,gson-2.9.1.jar,HikariCP-4.0.3.jar,httpcore-4.4.16.jar,jackson-datatype-jdk8-2.13.5.jar,jackson-datatype-jsr310-2.13.5.jar,jackson-module-parameter-names-2.13.5.jar,jakarta.activation-1.2.2.jar,jakarta.annotation-api-1.3.5.jar,jakarta.mail-1.6.7.jar,javax.inject-1.jar,json-lib-2.4-jdk15.jar,jxl-2.4.2.jar,lombok-1.18.30.jar,lucy-xss-1.6.3.jar,lucy-xss-servlet-2.0.0.jar,mybatis-3.5.14.jar,mybatis-spring-2.1.2.jar,mybatis-spring-boot-autoconfigure-2.3.2.jar,mybatis-spring-boot-starter-2.3.2.jar,poi-3.12.jar,poi-ooxml-3.12.jar,poi-ooxml-schemas-3.12.jar,postgresql-42.7.13.jar,sitemesh-3.0.1.jar,spring-jcl-5.3.31.jar,spring-security-acl-5.7.11.jar,spring-security-config-5.7.11.jar,spring-security-core-5.7.11.jar,spring-security-crypto-5.7.11.jar,spring-security-web-5.7.11.jar,spring-web-5.3.31.jar,stax-api-1.0.1.jar,tomcat-embed-jasper-9.0.83.jar,tomcat-embed-websocket-9.0.83.jar,xmlbeans-2.6.0.jar
server.servlet.session.timeout=600s

spring.servlet.multipart.max-file-size=800MB
spring.servlet.multipart.max-request-size=800MB

server.port=3508
